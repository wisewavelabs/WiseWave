name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            src/runtime/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release
        run: npx mygo build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-amd64
          path: dist/windows-amd64/wisewave-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $tag = "latest"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "Latest Windows installer from main.`n`nCommit: $short`nUpdated automatically on every push to main."
          $assets = @(Get-ChildItem -LiteralPath "dist/windows-amd64" -File | Where-Object {
            $_.Name -like "wisewave-setup-*.exe"
          })
          if ($assets.Count -ne 1) { throw "Expected one WiseWave setup installer; found $($assets.Count)." }

          # Replace any previous rolling release. Missing release/tag is fine.
          gh release delete $tag --yes --cleanup-tag *> $null

          $ErrorActionPreference = "Stop"
          gh release create $tag --latest --title "WiseWave" --notes $notes --target $env:GITHUB_SHA -- $assets.FullName
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
