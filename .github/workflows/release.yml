name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.sum
            src/runtime/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release
        run: npx mygo build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: wisewave-windows-amd64
          path: dist/windows-amd64/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:RELEASE_TAG }
          $assets = Get-ChildItem -LiteralPath "dist/windows-amd64" -File
          if (-not $assets) { throw "No Windows release assets were produced." }
          $assetPaths = $assets.FullName
          gh release create $tag --generate-notes --title "WiseWave $tag" @assetPaths
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
